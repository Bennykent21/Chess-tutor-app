<!doctype html>
<meta charset="utf-8">
<script type="module">
const post = (route, body) => fetch(route, { method: 'POST', body });
const fail = (m) => post('/log', 'ERROR ' + m).then(() => post('/done', ''));
window.onerror = (m) => { fail(m); };
window.onunhandledrejection = (e) => { fail(e.reason && e.reason.stack || e.reason); };

await post('/log', 'webgpu ' + !!navigator.gpu);
const adapter = navigator.gpu && await navigator.gpu.requestAdapter();
await post('/log', 'adapter ' + (adapter ? (adapter.info && adapter.info.description || 'yes') : 'none'));
const { initUNetFromURL } = await import('https://cdn.jsdelivr.net/npm/oidn-web@0.5.0/dist/oidn.js');
const unet = await initUNetFromURL('oidn/rt_ldr.tza', undefined, { aux: false, hdr: false });
const names = new URLSearchParams(location.search).get('names').split(',');
for (const name of names) {
    const img = new Image();
    img.src = `out/${name}.png`;
    await img.decode();
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0);
    const data = g.getImageData(0, 0, c.width, c.height);
    const t = performance.now();
    const output = await new Promise((resolve) => {
        unet.tileExecute({ color: data, done: resolve, progress: () => {} });
    });
    const out = g.createImageData(c.width, c.height);
    out.data.set(output.data);
    if (name.includes('_day')) {
        const greens = [];
        for (let i = 1; i < out.data.length; i += 4 * 7) greens.push(out.data[i]);
        greens.sort((p, q) => p - q);
        const onBoard = /blunders|battle|explore|position/.test(name);
        const gain = Math.min(1.3, 255 / Math.max(1, greens[Math.floor(greens.length * (onBoard ? 0.92 : 0.4))]));
        for (let i = 0; i < out.data.length; i += 4) for (let k = 0; k < 3; k++) out.data[i + k] = Math.min(255, out.data[i + k] * gain);
    }
    g.putImageData(out, 0, 0);
    await post('/save?name=' + name + '_dn.png', c.toDataURL('image/png'));
    await post('/log', `${name} denoised in ${((performance.now() - t) / 1000).toFixed(0)}s`);
}
await post('/done', '');
</script>
