<!doctype html>
<meta charset="utf-8">
<script type="module">
const post = (route, body) => fetch(route, { method: 'POST', body });
const names = new URLSearchParams(location.search).get('names').split(',');
for (const name of names) {
    const img = new Image();
    img.src = `out/${name}_dn.png`;
    await img.decode();
    const w = 1080, h = Math.round(img.height * w / img.width);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, 0, 0, w, h);
    await post('/save?name=art_' + name + '.webp', c.toDataURL('image/webp', 0.86));
}
await post('/done', '');
</script>
