<!doctype html>
<meta charset="utf-8">
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}</script>
<script type="module">
// Inflates a flat icon into a rounded, polished form and reflects a real studio in it.
// Each pixel gets a surface direction from the icon's shape, then looks up the light from the HDRI.
const post = (route, body) => fetch(route, { method: 'POST', body });
const fail = (m) => post('/log', 'ERROR ' + m).then(() => post('/done', ''));
window.onerror = (m) => { fail(m); };
window.onunhandledrejection = (e) => { fail(e.reason && e.reason.stack || e.reason); };

const THREE = await import('three');
const { RGBELoader } = await import('three/addons/loaders/RGBELoader.js');
const { ICONS } = await import('./iconlist.js?v=' + Date.now());
const params = new URLSearchParams(location.search);
const only = params.get('only');
const WORK = 640, OUT = Number(params.get('size') || 320);

const hdr = await new RGBELoader().setDataType(THREE.FloatType).loadAsync('hdr/' + (params.get('hdr') || 'brown_photostudio_02') + '.hdr');
const env = { w: hdr.image.width, h: hdr.image.height, d: hdr.image.data };

/** A softened copy of the light, as a slightly rough surface sees it. */
function blurEnv(radius) {
    const { w, h, d } = env, out = new Float32Array(w * h * 3);
    const tmp = new Float32Array(w * h * 3);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) for (let c = 0; c < 3; c++) {
        let s = 0; for (let k = -radius; k <= radius; k += 2) s += d[(y * w + ((x + k + w) % w)) * 4 + c];
        tmp[(y * w + x) * 3 + c] = s / (radius + 1);
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) for (let c = 0; c < 3; c++) {
        let s = 0; for (let k = -radius; k <= radius; k += 2) s += tmp[(Math.min(h - 1, Math.max(0, y + k)) * w + x) * 3 + c];
        out[(y * w + x) * 3 + c] = s / (radius + 1);
    }
    return out;
}
const soft = blurEnv(14), sharp = blurEnv(3);

function lookup(map, dx, dy, dz, turn, out) {
    const u = (Math.atan2(dx, -dz) / (2 * Math.PI) + 0.5 + turn) % 1, v = Math.acos(Math.max(-1, Math.min(1, dy))) / Math.PI;
    const x = Math.floor(((u + 1) % 1) * (env.w - 1)), y = Math.floor(v * (env.h - 1));
    const i = (y * env.w + x) * 3;
    out[0] = map[i]; out[1] = map[i + 1]; out[2] = map[i + 2];
}

const aces = (x) => Math.min(1, Math.max(0, (x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14)));
const srgb = (x) => (x <= 0.0031308 ? 12.92 * x : 1.055 * x ** (1 / 2.4) - 0.055);
const toLinear = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
const hex = (s) => [1, 3, 5].map((i) => toLinear(parseInt(s.slice(i, i + 2), 16) / 255));

async function alphaOf(svgText) {
    const url = URL.createObjectURL(new Blob([svgText.replace('<svg ', '<svg fill="#fff" ')], { type: 'image/svg+xml' }));
    const img = new Image();
    img.src = url;
    await img.decode();
    return (blur) => {
        const c = document.createElement('canvas');
        c.width = c.height = WORK;
        const g = c.getContext('2d', { willReadFrequently: true });
        if (blur) g.filter = `blur(${blur}px)`;
        const pad = WORK * 0.06;
        g.drawImage(img, pad, pad, WORK - 2 * pad, WORK - 2 * pad);
        const d = g.getImageData(0, 0, WORK, WORK).data, a = new Float32Array(WORK * WORK);
        for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3] / 255;
        return a;
    };
}

/** A box blur in floats, across then down. */
function smooth(a, r) {
    const t = new Float32Array(a.length), n = 2 * r + 1;
    for (let y = 0; y < WORK; y++) for (let x = 0; x < WORK; x++) { let v = 0; for (let k = -r; k <= r; k++) v += a[y * WORK + Math.min(WORK - 1, Math.max(0, x + k))]; t[y * WORK + x] = v / n; }
    for (let y = 0; y < WORK; y++) for (let x = 0; x < WORK; x++) { let v = 0; for (let k = -r; k <= r; k++) v += t[Math.min(WORK - 1, Math.max(0, y + k)) * WORK + x]; a[y * WORK + x] = v / n; }
}

async function render(icon) {
    const blurred = await alphaOf(await (await fetch(`svg/${icon.svg}.svg`)).text());
    const mask = blurred(0), b1 = blurred(5), b2 = blurred(16), b3 = blurred(44);
    const tone = hex(icon.color), rough = icon.rough ?? 0, gain = icon.gain ?? 1;
    const height = new Float32Array(WORK * WORK);
    for (let i = 0; i < height.length; i++) height[i] = 0.45 * Math.sqrt(b1[i]) * 26 + 0.35 * Math.sqrt(b2[i]) * 80 + 0.2 * b3[i] * 190;
    smooth(height, 5); smooth(height, 5); smooth(height, 3);
    const c = document.createElement('canvas');
    c.width = c.height = WORK;
    const g = c.getContext('2d');
    const img = g.createImageData(WORK, WORK);
    const a = [0, 0, 0], b = [0, 0, 0], turn = icon.turn ?? 0.32;
    const px = (y, x) => height[Math.min(WORK - 1, Math.max(0, y)) * WORK + Math.min(WORK - 1, Math.max(0, x))];
    for (let y = 0; y < WORK; y++) for (let x = 0; x < WORK; x++) {
        const i = y * WORK + x;
        if (mask[i] <= 0) continue;
        // The surface's direction, tipped a little as if the icon were held up to the light.
        let nx = -(px(y, x + 1) - px(y, x - 1)) / 2 + 0.16, ny = (px(y + 1, x) - px(y - 1, x)) / 2 + 0.22, nz = 1;
        const len = Math.hypot(nx, ny, nz); nx /= len; ny /= len; nz /= len;
        const rx = 2 * nz * nx, ry = 2 * nz * ny, rz = 2 * nz * nz - 1;
        lookup(rough ? soft : sharp, rx, ry, rz, turn, a);
        lookup(soft, rx, ry, rz, turn, b);
        const fresnel = (1 - nz) ** 5;
        const out = img.data, o = i * 4;
        for (let k = 0; k < 3; k++) {
            const f0 = tone[k] + (1 - tone[k]) * fresnel;
            const body = (a[k] * 0.7 + b[k] * 0.3) * f0 * 2.1 * gain;
            const coat = a[k] * (0.03 + 0.5 * fresnel) * 1.2;
            out[o + k] = 255 * srgb(aces(body + coat));
        }
        out[o + 3] = 255 * mask[i];
    }
    g.putImageData(img, 0, 0);
    const small = document.createElement('canvas');
    small.width = small.height = OUT;
    const sg = small.getContext('2d');
    sg.imageSmoothingQuality = 'high';
    sg.drawImage(c, 0, 0, OUT, OUT);
    await post('/save?name=' + icon.name + '.png', small.toDataURL('image/png'));
    await post('/save?name=' + icon.name + '.webp', small.toDataURL('image/webp', 0.9));
}

for (const icon of ICONS) {
    if (only && !only.split(',').includes(icon.name)) continue;
    await render(icon);
}
await post('/log', 'finished');
await post('/done', '');
</script>
