name: Android CI

on:
  push:
    branches:
      - main
      - refactor/foundation
  pull_request:
    branches:
      - main
      - refactor/foundation

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --no-configuration-cache -Dhttps.protocols=TLSv1.2

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-configuration-cache -Dhttps.protocols=TLSv1.2

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-tutor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
