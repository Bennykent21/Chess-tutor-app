name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/foundation
  pull_request:
    branches:
      - main
      - refactor/foundation

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: ./gradlew test --no-configuration-cache -Dhttps.protocols=TLSv1.2

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-configuration-cache -Dhttps.protocols=TLSv1.2

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-tutor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
