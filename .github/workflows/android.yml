name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/foundation
      - fixes-and-puzzles
      # Phase branches (plan D21), so every pushed step gets an installable APK.
      - 'phase-*'
  pull_request:
    branches:
      - main
      - refactor/foundation

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up test signing key
        # Every APK must be signed with the SAME key, or Android refuses to install it over the
        # previous build (you would have to uninstall and lose your progress each time).
        # The key lives in the CI_DEBUG_KEYSTORE_B64 repository secret: a base64-encoded
        # debug keystore (password "android", alias "androiddebugkey"). It is a test key only.
        # NEVER use it, or any APK it signs, for Google Play.
        shell: bash
        env:
          CI_DEBUG_KEYSTORE_B64: ${{ secrets.CI_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$CI_DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$CI_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
            echo "Using the saved test key from CI_DEBUG_KEYSTORE_B64."
            exit 0
          fi
          echo "::warning title=No saved signing key::CI_DEBUG_KEYSTORE_B64 is not set, so this run uses a brand-new key. These APKs will NOT install over earlier builds."
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Ensure environment configuration
        shell: bash
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Run unit tests
        run: ./gradlew test --no-configuration-cache -Dhttps.protocols=TLSv1.2

      # The HTML report keeps full stack traces, including exceptions a test only reports
      # second-hand (such as kotlinx-coroutines-test's UncaughtExceptionsBeforeTest).
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Run Android lint
        run: ./gradlew lintDebug --no-configuration-cache -Dhttps.protocols=TLSv1.2

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      # Stockfish 19 with its network embedded, 16 KB aligned (plan section 4.5). Built from
      # the pinned official source once, then cached until the build script changes.
      - name: Restore Stockfish build
        id: stockfish-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libstockfish.so
            app/src/main/jniLibs/x86_64/libstockfish.so
            stockfish-build
          key: stockfish-${{ hashFiles('tools/build_stockfish_android.sh') }}-ndk27.2.12479018

      - name: Install Android NDK r27c
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build Stockfish for Android
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        run: bash tools/build_stockfish_android.sh app/src/main/jniLibs stockfish-build/STOCKFISH_BUILD.txt

      - name: Check Stockfish binaries
        run: |
          cat stockfish-build/STOCKFISH_BUILD.txt
          ls -la app/src/main/jniLibs/*/libstockfish.so

      - name: Upload Stockfish binaries
        uses: actions/upload-artifact@v4
        with:
          name: stockfish-android
          path: |
            app/src/main/jniLibs/*/libstockfish.so
            stockfish-build/STOCKFISH_BUILD.txt
          if-no-files-found: error

      # Test APKs are arm64 only (every modern phone), so they carry one copy of the engine.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug -PctAbis=arm64-v8a --no-configuration-cache -Dhttps.protocols=TLSv1.2

      - name: Assemble release APK
        # R8 is on for release. Sign this CI build with the throwaway debug key so the minified
        # APK can be installed and tested on a phone. NEVER upload this build to Google Play.
        run: |
          KEYSTORE_PATH="$HOME/.android/debug.keystore" \
          STORE_PASSWORD=android KEY_ALIAS=androiddebugkey KEY_PASSWORD=android \
          ./gradlew assembleRelease -PctAbis=arm64-v8a --no-configuration-cache -Dhttps.protocols=TLSv1.2

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-tutor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-tutor-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload R8 mapping file
        uses: actions/upload-artifact@v4
        with:
          name: chess-tutor-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
